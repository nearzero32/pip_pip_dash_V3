<div class="image-upload-container">
  <label class="upload-label">{{ label || ('common.uploadImage' | t) }}</label>

  <div
    class="upload-area"
    [class.dragging]="isDragging()"
    [class.has-image]="previewUrl()"
    [class.error-border]="error"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (click)="fileInput.click()">

    <input
      #fileInput
      type="file"
      class="hidden-input"
      [accept]="acceptedTypes"
      (change)="onFileSelected($event)">

    @if (previewUrl()) {
      <div class="preview-container">
        <img [src]="previewUrl()" alt="Preview" class="image-preview">
        <button type="button" class="remove-btn" (click)="removeImage($event)" [title]="'common.removeImage' | t">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    } @else {
      <div class="placeholder-content">
        <div class="icon-circle">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </div>
        <p class="placeholder-text">{{ placeholder || ('common.uploadHint' | t) }}</p>
        <span class="upload-hint">PNG, JPG, WEBP (Max {{ maxSizeInMB }}MB)</span>
      </div>
    }
  </div>

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }
</div>
