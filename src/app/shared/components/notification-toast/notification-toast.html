<div class="toast-container">
  @for (notification of notificationService.notifications(); track notification.id) {
    <div class="toast-item"
         [class.success]="notification.type === 'success'"
         [class.error]="notification.type === 'error'"
         [class.warning]="notification.type === 'warning'"
         [class.info]="notification.type === 'info'">

      <div class="toast-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [innerHTML]="getIcon(notification.type)"></svg>
      </div>

      <div class="toast-content">
        <p class="toast-message">{{ notification.message }}</p>
      </div>

      <button class="toast-close" (click)="onClose(notification.id)" [attr.aria-label]="'common.close' | t">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="toast-progress" [style.animation-duration]="notification.duration + 'ms'"></div>
    </div>
  }
</div>
