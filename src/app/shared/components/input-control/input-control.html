<div class="input-control" [class.input-control--error]="error" [class.input-control--disabled]="disabled">@if (label) { <label class="input-control__label" [attr.for]="controlId">{{ label }} @if (required) { <span aria-hidden="true">*</span> }</label> }<div class="input-control__field"><input class="input-control__native" [id]="controlId" [type]="type" [value]="value" [placeholder]="placeholder" [disabled]="disabled" [required]="required" [attr.aria-invalid]="error ? 'true' : null" [attr.aria-describedby]="describedBy" (input)="change($event)" /></div>@if (hint) { <p class="input-control__hint" [id]="controlId + '-hint'">{{ hint }}</p> } @if (error) { <p class="input-control__error" [id]="controlId + '-error'" role="alert">{{ error }}</p> }</div>
