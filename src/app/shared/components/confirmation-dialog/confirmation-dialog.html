<div
  class="dialog-overlay"
  (click)="onCancel()"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'confirm-title'"
  [attr.aria-describedby]="'confirm-message'"
>
  <div
    class="dialog-container"
    [class.danger]="type === 'danger'"
    [class.warning]="type === 'warning'"
    [class.info]="type === 'info'"
    (click)="$event.stopPropagation()"
    (keydown)="trapTab($event)"
  >
    <div
      class="dialog-icon"
      [class.danger-icon]="type === 'danger'"
      [class.warning-icon]="type === 'warning'"
      [class.info-icon]="type === 'info'"
      aria-hidden="true"
    >
      @if (type === 'danger') {
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      }
      @if (type === 'warning') {
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      }
      @if (type === 'info') {
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      }
    </div>

    <div class="dialog-content">
      <h3 class="dialog-title" id="confirm-title">{{ displayTitle }}</h3>
      <p class="dialog-message" id="confirm-message">{{ displayMessage }}</p>
    </div>

    <div class="dialog-actions">
      <button type="button" class="dialog-btn btn-cancel" (click)="onCancel()">
        {{ displayCancel }}
      </button>
      <button
        type="button"
        class="dialog-btn btn-confirm"
        [class.danger-btn]="type === 'danger'"
        [class.warning-btn]="type === 'warning'"
        [class.info-btn]="type === 'info'"
        (click)="onConfirm()"
      >
        {{ displayConfirm }}
      </button>
    </div>
  </div>
</div>
