<div class="location-picker">
  <div class="location-picker__search">
    <svg class="location-picker__search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input
      #searchInput
      type="search"
      class="form-input"
      [placeholder]="searchPlaceholderKey() | t"
      [attr.aria-label]="searchPlaceholderKey() | t"
      [disabled]="disabled() || !mapReady()"
      (keydown.enter)="preventEnterSubmit($event)"
    />
  </div>

  <div class="location-picker__frame">
    <div
      class="location-picker__host"
      #mapHost
      role="application"
      [attr.aria-label]="'geo.mapLabelAria' | t"
    ></div>
    @if (coordsLabel()) {
      <div class="location-picker__coords">{{ coordsLabel() }}</div>
    }
    @if (!mapReady() && !mapFailed()) {
      <div class="location-picker__state">{{ 'geo.mapLoading' | t }}</div>
    }
    @if (mapFailed()) {
      <div class="location-picker__state location-picker__state--error">
        <strong>{{ 'zones.mapNotConfigured' | t }}</strong>
        <span>{{ 'zones.mapConfigurationHelp' | t }}</span>
      </div>
    }
  </div>

  <p class="hint-text">{{ hintKey() | t }}</p>
</div>
