<div class="select-control" [class.select-control--error]="error" [class.select-control--disabled]="disabled">
  @if (label) {
    <label class="select-control__label" [attr.for]="controlId">
      {{ label }}
      @if (required) { <span class="select-control__required" aria-hidden="true">*</span> }
    </label>
  }

  <div class="select-control__field">
    <select
      class="select-control__native"
      [id]="controlId"
      [value]="value"
      [disabled]="disabled"
      [required]="required"
      [attr.aria-invalid]="error ? 'true' : null"
      [attr.aria-describedby]="describedBy"
      (change)="change($event)"
    >
      @if (placeholder) {
        <option value="">{{ placeholder }}</option>
      }
      @for (option of options; track option.value) {
        <option [value]="option.value" [disabled]="option.disabled ?? false">{{ option.label }}</option>
      }
    </select>
    <svg class="select-control__chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>

  @if (hint) { <p class="select-control__hint" [id]="controlId + '-hint'">{{ hint }}</p> }
  @if (error) { <p class="select-control__error" [id]="controlId + '-error'" role="alert">{{ error }}</p> }
</div>
