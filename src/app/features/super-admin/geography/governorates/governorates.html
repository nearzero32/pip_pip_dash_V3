<section class="feature-page super-admin-page">
  <div class="page-toolbar">
    <div class="page-toolbar__context">
      <h1>{{ 'nav.governorates' | t }}</h1>
      <p class="hint">{{ 'geo.govHint' | t }}</p>
    </div>
    <div class="page-toolbar__actions">
      <app-input-control type="search" [placeholder]="'common.search' | t" [value]="search()" (valueChange)="onSearchChanged($event)"></app-input-control>
      <app-export-button [isLoading]="exporting()" (action)="exportList()"></app-export-button>
    </div>
  </div>

  <app-page-stats [data]="data()" [total]="pagination()?.total ?? data().length"></app-page-stats>

  <app-table
    [data]="data()"
    [columns]="columns"
    [pagination]="pagination()"
    [isLoading]="isLoading()"
    [allowDelete]="false"
    [allowRestore]="true"
    (pageChange)="load($event)"
    (onEdit)="onEdit($event)"
    (onRestore)="restore($event)"
  ></app-table>
</section>

@if (showForm()) {
  <app-form-dialog
    [modernSelect]="true"
    [title]="'geo.editGovernorate' | t"
    [fields]="fields"
    [initialData]="editing()"
    [isSubmitting]="submitting()"
    (onClose)="closeForm()"
    (onSubmit)="save($event)"
  ></app-form-dialog>
}
