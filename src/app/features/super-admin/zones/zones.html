<section class="feature-page super-admin-page"><div class="page-toolbar"><div class="page-toolbar__context"><p class="hint">{{ 'zones.tableSummary' | t }}</p></div><div class="page-toolbar__actions"><app-select-control [label]="'common.city' | t" [placeholder]="'common.select' | t" [value]="cityId()" [options]="cityOptions()" (valueChange)="selectCity($event)"></app-select-control><app-input-control type="search" [placeholder]="'common.search' | t" [value]="search()" [disabled]="!cityId()" (valueChange)="setSearch($event)"></app-input-control><app-select-control [label]="'geo.status' | t" [placeholder]="'catalog.statusAll' | t" [value]="statusFilter()" [options]="statusOptions()" [disabled]="!cityId()" (valueChange)="selectStatus($event)"></app-select-control><button class="add-btn" type="button" [disabled]="!cityId()" (click)="create()">{{ 'zones.create' | t }}</button></div></div><app-page-stats [data]="rows()"></app-page-stats><app-table [data]="rows()" [columns]="columns" [isLoading]="loading()" [allowDelete]="true" [allowRestore]="true" rowKey="id" (onEdit)="edit($event)" (onRestore)="restore($event)" (onDelete)="archive($event)"></app-table></section>
@if (dialog()) { <app-form-dialog [modernSelect]="true" [title]="(editing() ? 'zones.edit' : 'zones.create') | t" [fields]="fields()" [initialData]="initial()" [isSubmitting]="saving()" (onClose)="dialog.set(false)" (onSubmit)="save($event)"></app-form-dialog> }
