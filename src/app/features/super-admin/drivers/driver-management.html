<section class="feature-page">
  <div class="page-toolbar">
    <div class="page-toolbar__context">
      <p class="hint">{{ 'drivers.managementHint' | t }}</p>
    </div>
    <div class="page-toolbar__actions">
      <app-select-control
        class="driver-management__city"
        id="driver-management-city"
        [label]="'common.city' | t"
        [placeholder]="'drivers.allCities' | t"
        [value]="selectedCityId()"
        [options]="cityOptions()"
        (valueChange)="onCityChanged($event)"
      ></app-select-control>
      <button class="add-btn" type="button" [disabled]="!selectedCityId()" (click)="openCreate()">
        {{ 'drivers.add' | t }}
      </button>
    </div>
  </div>

  <app-table
    [data]="data()"
    [columns]="columns"
    [pagination]="pagination()"
    [isLoading]="isLoading()"
    [allowDelete]="false"
    [allowView]="true"
    [allowPassword]="true"
    rowKey="accountId"
    (pageChange)="load($event)"
    (onEdit)="openEdit($event)"
    (onView)="openDetails($event)"
    (onPassword)="openAccessCode($event)"
  ></app-table>
</section>
@if (detailDriver(); as driver) { <app-detail-dialog [title]="driver.driverName || driver.phone" [subtitle]="driver.phone" [sections]="detailSections()" (close)="detailDriver.set(null)"></app-detail-dialog> }

@if (showForm()) {
  <app-form-dialog
    [modernSelect]="true"
    [title]="formTitle()"
    [fields]="fields()"
    [steps]="wizardSteps()"
    [initialData]="formMode() === 'edit' ? editing() : null"
    [isSubmitting]="submitting()"
    (onClose)="closeForm()"
    (onSubmit)="save($event)"
  ></app-form-dialog>
}
