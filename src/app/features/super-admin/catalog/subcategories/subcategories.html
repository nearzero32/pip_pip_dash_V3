<section class="sa-catalog">
  <header><div><p class="eyebrow">{{ 'nav.categoriesSub' | t }}</p><h1>{{ 'nav.categoriesSub' | t }}</h1></div><button class="add-btn" type="button" [disabled]="!mainId()" (click)="create()">{{ 'common.add' | t }}</button></header>
  <div class="filters"><label>{{ 'nav.cities' | t }}<select [ngModel]="cityId()" (ngModelChange)="selectCity($event)"><option value="">—</option>@for (city of cities(); track city.id) { <option [value]="city.id">{{ label(city) }}</option> }</select></label><label>{{ 'catalog.parent' | t }}<select [disabled]="!cityId()" [ngModel]="mainId()" (ngModelChange)="selectMain($event)"><option value="">—</option>@for (main of mains(); track main.id) { <option [value]="main.id">{{ label(main) }}</option> }</select></label></div>
  @if (loading()) { <p>{{ 'common.loading' | t }}</p> } @else if (mainId()) { <div class="rows">@for (row of rows(); track row.id) { <button type="button" (click)="edit(row)"><span>{{ label(row) }}</span><small>{{ row.displayOrder }} · {{ ('status.' + row.status) | t }}</small></button> } @empty { <p>{{ 'common.noData' | t }}</p> }</div> }
</section>
@if (open()) { <div class="modal"><form (ngSubmit)="save()"><header><h2>{{ editing() ? ('catalog.editSub' | t) : ('catalog.addSub' | t) }}</h2><button type="button" (click)="open.set(false)">×</button></header><label dir="rtl">{{ 'geo.nameAr' | t }}<input required [ngModel]="nameAr()" name="nameAr" (ngModelChange)="nameAr.set($event)" /></label><label dir="ltr">{{ 'geo.nameEn' | t }}<input required [ngModel]="nameEn()" name="nameEn" (ngModelChange)="nameEn.set($event)" /></label><label>{{ 'geo.status' | t }}<select [ngModel]="status()" name="status" (ngModelChange)="status.set($event)"><option value="ACTIVE">{{ 'status.ACTIVE' | t }}</option><option value="INACTIVE">{{ 'status.INACTIVE' | t }}</option></select></label><label>{{ 'catalog.displayOrder' | t }}<input type="number" min="0" [ngModel]="displayOrder()" name="displayOrder" (ngModelChange)="displayOrder.set(+$event)" /></label><footer><button type="button" (click)="open.set(false)">{{ 'common.cancel' | t }}</button><button class="add-btn" [disabled]="saving()">{{ 'common.save' | t }}</button></footer></form></div> }
