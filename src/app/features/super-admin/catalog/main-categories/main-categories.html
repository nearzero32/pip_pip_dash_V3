<section class="feature-page"><div class="page-toolbar"><div class="page-toolbar__context"><p class="hint">{{ 'catalog.mainHint' | t }}</p></div><div class="page-toolbar__actions"><app-select-control [label]="'common.city' | t" [placeholder]="'common.select' | t" [value]="cityId()" [options]="cityOptions()" (valueChange)="selectCity($event)"></app-select-control><app-input-control type="search" [placeholder]="'catalog.search' | t" [value]="search()" (valueChange)="setSearch($event)"></app-input-control><app-select-control [label]="'geo.status' | t" [placeholder]="'catalog.statusAll' | t" [value]="status()" [options]="statusOptions()" (valueChange)="setStatus($event)"></app-select-control><app-export-button endpoint="/api/v1/dashboard/main-categories/export" filename="main-categories.xlsx" [params]="{ cityId: cityId(), search: search(), status: status() }" [disabled]="!cityId()"></app-export-button><button class="add-btn" type="button" [disabled]="!cityId()" (click)="create()">{{ 'catalog.addMain' | t }}</button></div></div><app-table [data]="rows()" [columns]="columns" [isLoading]="loading()" [allowDelete]="true" [allowRestore]="true" rowKey="id" (onEdit)="edit($event)" (onRestore)="restore($event)" (onDelete)="archiveTarget.set($event)"></app-table></section>
@if (dialog()) { <app-form-dialog [modernSelect]="true" [title]="(editing() ? 'catalog.editMain' : 'catalog.addMain') | t" [fields]="fields()" [initialData]="initial()" [isSubmitting]="saving()" (onClose)="dialog.set(false)" (onSubmit)="save($event)"></app-form-dialog> }
@if (archiveTarget()) { <app-confirmation-dialog [type]="'danger'" [title]="'catalog.archiveMainTitle' | t" (confirm)="confirmArchive()" (cancel)="archiveTarget.set(null)"></app-confirmation-dialog> }
