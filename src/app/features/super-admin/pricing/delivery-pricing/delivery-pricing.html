<section class="feature-page">
  <div class="page-toolbar">
    <div class="page-toolbar__context">
      <p class="hint">{{ 'pricing.deliveryHint' | t }}</p>
    </div>
    <div class="page-toolbar__actions">
      <label class="filter-field">
        <span class="filter-field__label">{{ 'pricing.search' | t }}</span>
        <input
          class="city-picker"
          type="search"
          [value]="search()"
          (input)="onSearchInput($any($event.target).value)"
          [placeholder]="'pricing.searchPlaceholder' | t"
          [attr.aria-label]="'pricing.search' | t"
        />
      </label>
      <label class="filter-field">
        <span class="filter-field__label">{{ 'geo.status' | t }}</span>
        <select
          class="city-picker"
          [ngModel]="statusFilter()"
          (ngModelChange)="onStatusChange($event)"
        >
          <option value="">{{ 'pricing.allStatuses' | t }}</option>
          <option value="DRAFT">{{ 'status.DRAFT' | t }}</option>
          <option value="ACTIVE">{{ 'status.ACTIVE' | t }}</option>
          <option value="INACTIVE">{{ 'status.INACTIVE' | t }}</option>
        </select>
      </label>
      <label class="filter-field">
        <span class="filter-field__label">{{ 'common.city' | t }}</span>
        <select
          class="city-picker"
          [ngModel]="cityId()"
          (ngModelChange)="onCityChange($event)"
          [attr.aria-label]="'common.city' | t"
        >
          @for (city of cities(); track city.id) {
            <option [value]="city.id">{{ city.nameEn }}</option>
          }
        </select>
      </label>
      <button class="add-btn" type="button" (click)="showForm.set(true)">{{ 'pricing.addAndActivate' | t }}</button>
    </div>
  </div>

  <app-table
    [data]="data()"
    [columns]="columns"
    [pagination]="pagination()"
    [isLoading]="isLoading()"
    [allowDelete]="false"
    (pageChange)="onPageChange($event)"
    (onEdit)="onEdit($event)"
  ></app-table>

  <p class="info-callout">{{ 'pricing.activateHint' | t }}</p>
</section>

@if (showForm()) {
  <app-form-dialog
    [title]="'pricing.addAndActivate' | t"
    [fields]="fields"
    [isSubmitting]="submitting()"
    (onClose)="showForm.set(false)"
    (onSubmit)="save($event)"
  ></app-form-dialog>
}

@if (activateId()) {
  <app-confirmation-dialog
    [type]="'warning'"
    [title]="'pricing.activate' | t"
    (confirm)="confirmActivate()"
    (cancel)="activateId.set(null)"
  ></app-confirmation-dialog>
}
