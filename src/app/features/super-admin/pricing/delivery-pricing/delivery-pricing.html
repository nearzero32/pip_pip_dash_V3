<section class="feature-page">
  <div class="page-toolbar">
    <div class="page-toolbar__context">
      <p class="hint">{{ 'pricing.deliveryHint' | t }}</p>
    </div>
    <div class="page-toolbar__actions">
      <label class="filter-field">
        <span class="filter-field__label">{{ 'pricing.search' | t }}</span>
        <input
          class="city-picker"
          type="search"
          [value]="search()"
          (input)="onSearchInput($any($event.target).value)"
          [placeholder]="'pricing.searchPlaceholder' | t"
          [attr.aria-label]="'pricing.search' | t"
        />
      </label>
      <app-select-control class="filter-field" [label]="'geo.status' | t" [placeholder]="'pricing.allStatuses' | t" [value]="statusFilter()" [options]="statusOptions()" (valueChange)="onStatusChange($event)"></app-select-control>
      <app-select-control class="filter-field" [label]="'common.city' | t" [value]="cityId()" [options]="cityOptions()" (valueChange)="onCityChange($event)"></app-select-control>
      <app-export-button [endpoint]="'/api/v1/dashboard/cities/' + cityId() + '/delivery-pricing/versions/export'" filename="delivery-pricing.xlsx" [params]="{ search: search(), status: statusFilter() }" [disabled]="!cityId()"></app-export-button>
      <button class="add-btn" type="button" (click)="showForm.set(true)">{{ 'pricing.addAndActivate' | t }}</button>
    </div>
  </div>

  <app-table
    [data]="data()"
    [columns]="columns"
    [pagination]="pagination()"
    [isLoading]="isLoading()"
    [allowDelete]="false"
    [allowRestore]="true"
    (pageChange)="onPageChange($event)"
    (onEdit)="onEdit($event)"
    (onRestore)="restore($event)"
  ></app-table>

  <p class="info-callout">{{ 'pricing.activateHint' | t }}</p>
</section>

@if (showForm()) {
  <app-form-dialog
    [modernSelect]="true"
    [title]="'pricing.addAndActivate' | t"
    [fields]="fields"
    [isSubmitting]="submitting()"
    (onClose)="showForm.set(false)"
    (onSubmit)="save($event)"
  ></app-form-dialog>
}

@if (activateId()) {
  <app-confirmation-dialog
    [type]="'warning'"
    [title]="'pricing.activate' | t"
    (confirm)="confirmActivate()"
    (cancel)="activateId.set(null)"
  ></app-confirmation-dialog>
}
