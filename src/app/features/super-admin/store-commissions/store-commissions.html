<section class="feature-page"><div class="page-toolbar"><div class="page-toolbar__context"><p class="hint">{{ 'commission.hint' | t }}</p></div><div class="page-toolbar__actions"><app-select-control [label]="'common.city' | t" [value]="cityId()" [options]="cityOptions()" (valueChange)="selectCity($event)"></app-select-control><app-input-control type="search" [placeholder]="'commission.search' | t" [value]="search()" (valueChange)="setSearch($event)"></app-input-control><app-select-control [label]="'commission.status' | t" [placeholder]="'commission.allStatuses' | t" [value]="status()" [options]="statusOptions()" (valueChange)="setStatus($event)"></app-select-control><app-export-button endpoint="/api/v1/dashboard/store-commissions/export" filename="store-commissions.xlsx" [params]="{ cityId: cityId(), search: search(), status: status() }" [disabled]="!cityId()"></app-export-button><button class="add-btn" type="button" [disabled]="!selectedStoreIds().length" (click)="bulkEditorOpen.set(true)">{{ 'commission.editMultiple' | t }} ({{ selectedStoreIds().length }})</button></div></div><app-table [data]="rows()" [columns]="columns" [pagination]="pagination()" [isLoading]="loading()" [allowDelete]="false" [allowEdit]="false" [allowView]="true" [allowRestore]="true" [selectable]="true" [selectedKeys]="selectedStoreIds()" rowKey="storeId" (selectedKeysChange)="selectedStoreIds.set($event)" (pageChange)="load($event)" (onView)="openDetails($event)" (onRestore)="restore($event)"></app-table></section>
@if (selected(); as commission) { <div class="modal-overlay" (click)="selected.set(null)"><section class="modal-content commission-modal" (click)="$event.stopPropagation()"><header class="modal-header"><h2>{{ commission.storeName }}</h2><button type="button" (click)="selected.set(null)">×</button></header><div class="modal-body"><p class="commission-rate">{{ commission.platformCommissionRate }}%</p><button class="add-btn" type="button" [disabled]="commission.status === 'ARCHIVED'" (click)="editorOpen.set(true)">{{ 'commission.edit' | t }}</button><h3>{{ 'commission.history' | t }}</h3><app-table [data]="history()" [columns]="historyColumns" [isLoading]="historyLoading()" [showActions]="false" rowKey="id"></app-table></div></section></div> }
@if (editorOpen()) { <app-form-dialog [modernInput]="true" [title]="'commission.edit' | t" [fields]="fields()" [initialData]="selected()" [isSubmitting]="submitting()" (onClose)="editorOpen.set(false)" (onSubmit)="save($event)"></app-form-dialog> }
@if (bulkEditorOpen()) { <app-form-dialog [modernInput]="true" [title]="'commission.editMultiple' | t" [fields]="fields()" [isSubmitting]="submitting()" (onClose)="bulkEditorOpen.set(false)" (onSubmit)="saveBulk($event)"></app-form-dialog> }
