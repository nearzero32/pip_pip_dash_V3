<section class="feature-page super-admin-page"><div class="page-toolbar"><div class="page-toolbar__context"><p class="hint">{{ 'commission.hint' | t }}</p></div><div class="page-toolbar__actions"><app-select-control [label]="'common.city' | t" [value]="cityId()" [options]="cityOptions()" (valueChange)="selectCity($event)"></app-select-control><app-input-control type="search" [placeholder]="'commission.search' | t" [value]="search()" (valueChange)="setSearch($event)"></app-input-control><app-select-control [label]="'commission.status' | t" [placeholder]="'commission.allStatuses' | t" [value]="status()" [options]="statusOptions()" (valueChange)="setStatus($event)"></app-select-control><app-export-button endpoint="/api/v1/dashboard/store-commissions/export" filename="store-commissions.xlsx" [params]="{ cityId: cityId(), search: search(), status: status() }" [disabled]="!cityId()"></app-export-button><button class="add-btn" type="button" [disabled]="!selectedStoreIds().length" (click)="bulkEditorOpen.set(true)">{{ 'commission.editMultiple' | t }} ({{ selectedStoreIds().length }})</button></div></div><app-page-stats [data]="rows()" [total]="pagination()?.total ?? rows().length"></app-page-stats><app-table [data]="rows()" [columns]="columns" [pagination]="pagination()" [isLoading]="loading()" [allowDelete]="false" [allowEdit]="true" [allowView]="true" [allowRestore]="true" [selectable]="true" [selectedKeys]="selectedStoreIds()" rowKey="storeId" (selectedKeysChange)="selectedStoreIds.set($event)" (pageChange)="load($event)" (onEdit)="openEditor($event)" (onView)="openDetails($event)" (onRestore)="restore($event)"></app-table></section>
@if (selected(); as commission) {
  <app-detail-dialog headerIcon="%" [wide]="true" [title]="commission.storeName" [subtitle]="commission.platformCommissionRate + '%'" [sections]="detailSections()" (close)="closeDetails()">
    <section class="commission-history">
      <header class="commission-history__header">
        <span class="commission-history__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 19V9m5 10V5m5 14v-7m5 7V3" />
          </svg>
        </span>
        <div>
          <h3>{{ 'commission.history' | t }}</h3>
          <span>{{ history().length }}</span>
        </div>
      </header>
      <app-table [data]="history()" [columns]="historyColumns" [isLoading]="historyLoading()" [showActions]="false" rowKey="id"></app-table>
    </section>
  </app-detail-dialog>
}
@if (editorOpen()) { <app-form-dialog [modernInput]="true" [title]="'commission.edit' | t" [fields]="fields()" [initialData]="editing()" [isSubmitting]="submitting()" (onClose)="closeEditor()" (onSubmit)="save($event)"></app-form-dialog> }
@if (bulkEditorOpen()) { <app-form-dialog [modernInput]="true" [title]="'commission.editMultiple' | t" [fields]="fields()" [isSubmitting]="submitting()" (onClose)="bulkEditorOpen.set(false)" (onSubmit)="saveBulk($event)"></app-form-dialog> }
