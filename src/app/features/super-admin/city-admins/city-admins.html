<section class="feature-page super-admin-page">
  <div class="page-toolbar">
    <div class="page-toolbar__context">
      <h1>{{ 'nav.cityAdmins' | t }}</h1>
      <p class="hint">{{ 'staff.adminHint' | t }}</p>
    </div>
    <div class="page-toolbar__actions">
      <app-input-control type="search" [placeholder]="'common.search' | t" [value]="search()" (valueChange)="onSearchChanged($event)"></app-input-control>
      <app-export-button [isLoading]="exporting()" (action)="exportList()"></app-export-button>
      <button class="add-btn" type="button" [disabled]="isLoadingCities()" (click)="openCreate()">
        {{ 'staff.addAdmin' | t }}
      </button>
    </div>
  </div>

  <app-page-stats [data]="data()"></app-page-stats>

  <app-table
    [data]="data()"
    [columns]="columns"
    [isLoading]="isLoading()"
    [allowDelete]="false"
    [allowRestore]="true"
    [allowPassword]="true"
    (onEdit)="onEdit($event)"
    (onRestore)="restore($event)"
    (onPassword)="onPassword($event)"
  ></app-table>
</section>

@if (showForm()) {
  <app-form-dialog
    [modernSelect]="true"
    [title]="formTitle()"
    [fields]="fields()"
    [initialData]="formMode() === 'password' ? null : editing()"
    [isSubmitting]="submitting()"
    (onClose)="closeForm()"
    (onSubmit)="save($event)"
  ></app-form-dialog>
}
