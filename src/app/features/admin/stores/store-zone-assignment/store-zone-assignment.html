<div class="zone-assign" role="dialog" aria-modal="true" [attr.aria-labelledby]="'store-zone-assign-title'">
  <div class="zone-assign__panel">
    <header class="zone-assign__header">
      <h2 id="store-zone-assign-title">{{ 'stores.editServiceZones' | t }}</h2>
      <button class="ghost-btn" type="button" (click)="closed.emit()">{{ 'common.cancel' | t }}</button>
    </header>

    <p class="hint">{{ 'stores.assignmentHint' | t }}</p>

    @if (fieldError()) {
      <p class="zone-assign__error">{{ fieldError() }}</p>
    }

    <div class="zone-assign__body">
      <app-store-zone-picker
        [assignableZones]="assignableZones()"
        [selectedIds]="selectedIds()"
        (selectedChange)="selectedChange.emit($event)"
      ></app-store-zone-picker>
      <app-store-map
        [zones]="mapZones()"
        [serviceZoneIds]="selectedIds()"
        [location]="location()"
        [error]="mapError()"
        [fallbackCenter]="fallbackCenter()"
      ></app-store-map>
    </div>

    <footer class="zone-assign__footer">
      <button class="ghost-btn" type="button" (click)="closed.emit()">{{ 'common.cancel' | t }}</button>
      <button class="add-btn" type="button" [disabled]="!canSave()" (click)="onSave()">
        {{ saving() ? ('common.saving' | t) : ('common.save' | t) }}
      </button>
    </footer>
  </div>
</div>
